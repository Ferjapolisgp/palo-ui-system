<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Palo UI</title>
  <meta name="description" content="Sistema visual de las herramientas internas de Palo: tokens, estilos y componentes Vue 3.">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee (mismo valor que aplicarTema()).
    try { const t = localStorage.getItem('tema'); if (t === 'claro') document.documentElement.dataset.theme = 'light'; if (t === 'oscuro') document.documentElement.dataset.theme = 'dark'; } catch {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
